name: arena
run-name: ${{ inputs.job }}
on:
  workflow_dispatch:
    inputs:
      job:
        description: branch holding bundle.zip
        required: true
      shards:
        description: number of parallel shards
        required: true
        default: "20"
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: echo "matrix=$(python3 -c 'import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))' '${{ inputs.shards }}')" >> "$GITHUB_OUTPUT"
  play:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.job }}
      - name: unpack
        env:
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
        run: |
          if [ -f bundle.enc ]; then openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in bundle.enc -out /tmp/bundle.zip -pass env:BUNDLE_KEY; else cp bundle.zip /tmp/bundle.zip; fi
          unzip -q /tmp/bundle.zip -d /tmp/b
      - name: install the engine (job.json "install" from harness/remote.py, else cambc 2.1.4)
        run: |
          cmd=$(python3 -c 'import json; print(json.load(open("/tmp/b/job.json")).get("install", ""))')
          [ -n "$cmd" ] || cmd='pip install -q uv && uv venv -q -p 3.14 /tmp/v && uv pip install -q -p /tmp/v/bin/python cambc==2.1.4'
          echo "$cmd"
          bash -c "$cmd"
          /tmp/v/bin/cambc --version
      - run: BC_SHARD='${{ matrix.shard }}/${{ inputs.shards }}' /tmp/v/bin/python /tmp/b/harness/remote_job.py /tmp/b/job.json out --cambc /tmp/v/bin/cambc
      - uses: actions/upload-artifact@v4
        with:
          name: r${{ matrix.shard }}
          path: out/result.json
          retention-days: 1
